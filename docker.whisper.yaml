# Whisper large-v3-turbo STT server — vLLM (`vllm serve`), OpenAI-compatible BATCH path
# (/v1/audio/transcriptions) on :8008. Multilingual; the client sends the language.
# Measured contract and the reasons for every flag are in llm/whisper/README.md.
#
#   docker compose -f docker.whisper.yaml up -d
#
# One of three interchangeable STT backends in this repo; pick exactly ONE — this file
# (Whisper, batch/multilingual), docker.giga.yaml (GigaAM, batch/ru) or docker.qwen.yaml
# (Qwen3-ASR, streaming/multilingual). All expose `stt:8008` and join the `voices` network.
#
# WHY vLLM: its PyTorch build ships sm_120 (RTX 50xx) code officially. whisper.cpp, used
# here until 2026-11-18, does not target that card (upstream image: archs 75–90 only; our
# own sm_120 build hung and crashed with Xid 13 — see AGENTS.md).
#
# The base image is the one xcono/tts already uses (35 GB, on disk once for both): Whisper
# is served by the plain vLLM inside it, without --omni. vLLM-Omni itself has no STT models.
# llm/whisper/Dockerfile adds one small patch on top (the `prompt` field).
#
# Weights (openai/whisper-large-v3-turbo, 1.5 GB) live in the shared HF cache volume. On a
# machine without them run the first `up` with HF_HUB_OFFLINE=0.
#
# Runs on GPU 1 by default (GPU 0 carries the desktop); override with ASR_GPU. DO NOT up in a
# sandbox — needs the GPU box + NVIDIA Container Toolkit.

name: asr

services:
  stt:
    # vllm/vllm-omni:v0.32.0 (PINNED in the Dockerfile; the flags below were checked on it)
    # plus one patch that makes the `prompt` field work. Build with BUILDX_BUILDER=default
    # so the 35 GB base is not pulled again into a container builder's own cache.
    build:
      context: ./llm/whisper
    image: xcono-asr-whisper
    ipc: host                        # vLLM's worker processes share memory
    ports:
      - "8008:8008"
    # --attention-backend / --mm-encoder-attn-backend: REQUIRED on sm_120. vLLM's own choice
    #   (bundled FlashAttention 2) loads fine and answers 200 with garbage — "ewewew…" up to
    #   the token limit for any audio. With these two the text is correct.
    # --kv-cache-memory-bytes + --gpu-memory-utilization: without them vLLM wants 92% of the
    #   card and refuses to start next to the TTS server. With a fixed KV cache the
    #   utilization value is only the start-up check; the process holds about 2.6 GB.
    # No --max-num-seqs: a small value drops the batch below one audio item (1500 tokens)
    #   and the server exits at start.
    command:
      - vllm
      - serve
      - openai/whisper-large-v3-turbo
      - --host=0.0.0.0
      - --port=8008
      - --served-model-name=whisper
      - --attention-backend=TRITON_ATTN
      - --mm-encoder-attn-backend=TORCH_SDPA
      - --kv-cache-memory-bytes=536870912
      - --gpu-memory-utilization=0.5
    environment:
      HF_HOME: /root/.cache/huggingface
      # Weights come from the shared cache; never reach out to the Hub at start.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-1}
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s             # about 100 s to ready with weights in the cache
    restart: unless-stopped

# Shared with the xcono/tts and xcono/voices stacks so weights are downloaded once.
volumes:
  hf-cache:
    name: llms_hf-cache
    external: true

# Literal `voices` network so this service and the voices orchestrator co-reside.
networks:
  default:
    name: voices
